name: Build One APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build one debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk NINOH-API-AGENT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NINOH-API-AGENT-APK
          path: NINOH-API-AGENT.apk
          if-no-files-found: error
          retention-days: 14
